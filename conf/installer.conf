# ============================================================================
# Open WebUI Auto-Installer - main configuration
# ----------------------------------------------------------------------------
# Every value below can be overridden via an environment variable (OWI_*) or
# a command-line flag on install.sh / update.sh.
#
# This file is sourced by the entry scripts and the lib/*.sh library.
# It must stay valid bash.
# ============================================================================

INSTALLER_NAME="Open WebUI Auto-Installer"
INSTALLER_VERSION="1.0.0"

# ----------------------------------------------------------------------------
# Paths (defaults; override with OWI_APP_DIR, OWI_INSTALL_DIR, ...)
# ----------------------------------------------------------------------------
# APP_DIR  : git checkout location (only used in "git" source mode)
# INSTALL_DIR : installer home: venv, state, env file, logs, backups
# DATA_DIR : Open WebUI data (database, uploads, vector store)
OWI_APP_DIR="${OWI_APP_DIR:-$HOME/open-webui}"
OWI_INSTALL_DIR="${OWI_INSTALL_DIR:-$HOME/.openwebui-installer}"
OWI_DATA_DIR="${OWI_DATA_DIR:-$HOME/.open-webui/data}"
OWI_PORT="${OWI_PORT:-8080}"
OWI_URL="${OWI_URL:-http://localhost:8080}"

# Python version to manage with uv. open-webui requires >= 3.11, < 3.13.
OWI_PYTHON="${OWI_PYTHON:-3.11}"

# ----------------------------------------------------------------------------
# Behaviour
# ----------------------------------------------------------------------------
OWI_YES="${OWI_YES:-0}"                 # assume "yes" for every prompt
OWI_DRY_RUN="${OWI_DRY_RUN:-0}"         # simulate everything, change nothing
OWI_FORCE="${OWI_FORCE:-0}"             # ignore safety guards / arch refusal
OWI_SOURCE_MODE="${OWI_SOURCE_MODE:-auto}"   # auto|pypi|git
OWI_ENV_KIND="${OWI_ENV_KIND:-auto}"         # auto|proot|termux|linux
OWI_PROFILE="${OWI_PROFILE:-auto}"           # auto|full|standard|light|minimal
OWI_ALLOW_BUILD="${OWI_ALLOW_BUILD:-0}"      # 0 = wheels only (default, safe)
OWI_OLLAMA_MODE="${OWI_OLLAMA_MODE:-auto}"   # auto|install|native|none
# OpenAI-compatible model gateway (e.g. OmniRoute at http://127.0.0.1:20128/v1).
# When set, Open WebUI uses it for chat AND RAG embeddings; Ollama is not needed.
OWI_OPENAI_BASE_URL="${OWI_OPENAI_BASE_URL:-}"
OWI_OPENAI_API_KEY="${OWI_OPENAI_API_KEY:-omni}"
OWI_RAG_EMBEDDING_MODEL="${OWI_RAG_EMBEDDING_MODEL:-text-embedding-3-small}"
OWI_WITH_EXTRAS="${OWI_WITH_EXTRAS:-}"       # extra pip packages, space separated
OWI_OPENWEBUI_VERSION="${OWI_OPENWEBUI_VERSION:-latest}"
OWI_START_SERVICE="${OWI_START_SERVICE:-1}"  # start the server at the end
OWI_RUN_UPDATE="${OWI_RUN_UPDATE:-0}"        # run the smart updater at the end

# ----------------------------------------------------------------------------
# Hardware profile thresholds (values in MB)
# ----------------------------------------------------------------------------
RAM_FULL_MIN_MB=8192        # 8 GB  -> full profile eligible
RAM_STANDARD_MIN_MB=4096    # 4 GB  -> standard eligible
RAM_LIGHT_MIN_MB=2048       # 2 GB  -> light eligible, below = minimal
STORAGE_FULL_MIN_MB=8192    # free disk (MB) for full
STORAGE_STANDARD_MIN_MB=5120
STORAGE_LIGHT_MIN_MB=3072
INSTALL_FULL_NEED_MB=7168   # estimated free space required for a full install
INSTALL_LIGHT_NEED_MB=3072  # estimated free space required for a light install

# ----------------------------------------------------------------------------
# System package lists
# ----------------------------------------------------------------------------
# Ubuntu (proot) packages -- everything here is prebuilt via apt.
APT_BASE_PKGS=(curl ca-certificates git gnupg procps tzdata)
APT_RUNTIME_PKGS=(libgomp1 libatomic1)   # OpenMP/atomic libs for numpy/torch wheels
APT_OPTIONAL_PKGS=(ffmpeg libmagic1)     # audio/video + file-type detection

# Termux-native packages (only used in termux env, or by termux-bootstrap.sh)
TERMUX_BASE_PKGS=(git curl)
TERMUX_TUR_PKGS=(uv)
TERMUX_OPTIONAL_PKGS=(proot-distro termux-services)

# Extra pip wheels worth pulling on capable profiles (all prebuilt wheels).
# NumPy/Pandas/Transformers/Tokenizers/SentencePiece/Torch already come in the
# open-webui base package; scipy is not, so it is added explicitly.
PIP_EXTRAS_FULL=(scipy)

# Light/minimal profiles install open-webui without its heavy tree and then the
# official backend/requirements-min.txt. That file alone is not enough to even
# import the app (verified against v0.11.0), so the installer additionally
# installs this curated set of small, pure-Python-or-light runtime deps that
# open-webui imports at startup. After that, a self-discovering loop catches
# anything a future release adds (see install_min_patch in lib/packages.sh).
MIN_PATCH_DISTS=(Markdown python-mimeparse validators pytz ldap3 tiktoken ddgs \
  boto3 azure-identity azure-storage-blob google-cloud-storage \
  google-api-python-client pillow fpdf2)
